name: Build Mihomo Rules

on:
  workflow_dispatch:

  push:
    paths:
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/**"

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest Mihomo
        shell: bash
        run: |
          set -euo pipefail

          rm -f mihomo mihomo.gz

          echo "Getting latest Mihomo release..."

          RELEASE_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"

          VERSION="$(echo "$RELEASE_JSON" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          print(data["tag_name"])
          ')"

          echo "Latest Mihomo version: ${VERSION}"

          # Prefer the generic linux-amd64 build.
          # If it does not exist, fall back to linux-amd64-v1.
          ASSET_URL="$(echo "$RELEASE_JSON" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assets = data.get("assets", [])

          preferred = [
              "mihomo-linux-amd64.gz",
              "mihomo-linux-amd64-v1.gz",
          ]

          for name in preferred:
              for asset in assets:
                  if asset["name"] == name:
                      print(asset["browser_download_url"])
                      sys.exit(0)

          # Last-resort fallback:
          # find any non-go, gzip-compressed linux-amd64 build.
          candidates = [
              asset
              for asset in assets
              if asset["name"].startswith("mihomo-linux-amd64")
              and asset["name"].endswith(".gz")
              and "-go" not in asset["name"]
          ]

          if candidates:
              candidates.sort(key=lambda x: (
                  "-compatible" in x["name"],
                  "-v1" not in x["name"]
              ))
              print(candidates[0]["browser_download_url"])
              sys.exit(0)

          print("No suitable linux-amd64 Mihomo asset found", file=sys.stderr)
          sys.exit(1)
          ')"

          echo "Downloading:"
          echo "$ASSET_URL"

          curl -fL --retry 3 --retry-delay 5 \
            "$ASSET_URL" \
            -o mihomo.gz

          gunzip -f mihomo.gz
          chmod +x mihomo

          echo "Installed Mihomo:"
          ./mihomo -v

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          pip3 install pyyaml

      - name: Clean sources
        shell: bash
        run: |
          set -euo pipefail

          # Удаляем старые источники, чтобы скрипт скачал свежие.
          rm -rf sources/*.yaml sources/*.txt 2>/dev/null || true

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/build.py

      - name: Debug
        shell: bash
        run: |
          echo "===== GIT STATUS ====="
          git status

          echo "===== CHANGED FILES ====="
          git diff --name-only

          echo "===== RULESET FILES ====="
          ls -la ruleset/ || echo "No ruleset folder"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No content changes. Creating empty commit to update timestamp..."
            git commit --allow-empty -m "Update mihomo rules [skip ci]"
          else
            git commit -m "Update mihomo rules"
          fi

          git push
