name: Build Mihomo Rules

on:
  workflow_dispatch:
  push:
    paths:
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Mihomo
        run: |
          rm -f mihomo mihomo.gz
          
          MIHOMO_VERSION="$(wget -qO- https://github.com/MetaCubeX/mihomo/releases/latest/download/version.txt | tr -d '\r\n')"
          
          echo "Latest Mihomo version: ${MIHOMO_VERSION}"
          
          wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Install python deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyyaml

      - name: Clean sources (force fresh download)
        run: |
          # Удаляем старые источники, чтобы скрипт скачал свежие
          rm -rf sources/*.yaml sources/*.txt 2>/dev/null || true

      - name: Build
        run: |
          python3 scripts/build.py

      - name: Debug
        run: |
          echo "===== GIT STATUS ====="
          git status
          echo "===== CHANGED FILES ====="
          git diff --name-only
          echo "===== RULESET FILES ====="
          ls -la ruleset/ || echo "No ruleset folder"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No content changes. Creating empty commit to update timestamp..."
            git commit --allow-empty -m "Update mihomo rules [skip ci]"
          else
            git commit -m "Update mihomo rules"
          fi

          git push
