name: Build Mihomo Rules

on:
  workflow_dispatch:

  push:
    paths:
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/**"

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Mihomo
        run: |
          # Удаляем старые файлы, если они есть
          rm -f mihomo mihomo.gz
          
          wget -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64-v1.19.29.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Install python deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyyaml

      - name: Build
        run: |
          python3 scripts/build.py

      - name: Debug
        run: |
          echo "===== GIT STATUS ====="
          git status

          echo "===== CHANGED FILES ====="
          git diff --name-only

          echo "===== DIFF ====="
          git diff --stat

          echo "===== RULESET ====="
          ls -lah ruleset

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Добавляем ВСЕ изменения
          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update mihomo rules"
          git push
